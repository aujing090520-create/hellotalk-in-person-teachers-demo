<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>附近面授老师 Demo</title>
    <link rel="icon" href="data:," />
  <link rel="stylesheet" href="styles.css?v=profile-summary-spacing" />
  </head>
  <body>
    <main class="workbench">
      <section class="phone" aria-label="附近面授老师 Demo 手机界面">
        <div id="app"></div>
      </section>
      <aside class="qa-panel" aria-label="Demo 验证控制台">
        <p class="eyebrow">6420-002 · Demo 控制台</p>
        <h1>附近面授老师</h1>
        <label class="console-language">界面语言<select id="console-ui-language"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option></select></label>
        <section class="console-scenarios" aria-label="一键验证场景">
          <b>验证场景</b>
          <p>选择一条完整用户路径，再在下方调整该路径必要的参数。</p>
          <div class="scenario-group"><span>找语伴模块</span><button data-scenario="partner-visible">展示条件满足</button><button data-scenario="partner-hidden">展示条件不满足</button></div>
          <div class="scenario-group"><span>面授课程搜索</span><button data-scenario="search-japanese">日语面授 · 跨城</button><button data-scenario="search-empty">日语面授 · 当前城无结果</button></div>
          <div class="scenario-group"><span>课程转化</span><button data-scenario="teacher-payment">课程预约与支付</button><button data-scenario="creator-offline">完整线下课程</button><button data-scenario="creator-search">地点搜索记录</button></div>
        </section>
        <section class="console-control-surface" aria-label="当前场景参数">
          <header><b>当前场景参数</b><small id="console-scenario-name"></small></header>
          <div id="scenario-parameters"></div>
        </section>
        <section class="console-expectation" id="console-expectation" aria-live="polite"></section>
        <button class="console-reset" data-console-action="reset">重置为默认场景</button>
      </aside>
    </main>
  <script src="app.js?v=profile-summary-spacing"></script>
  </body>
</html>
